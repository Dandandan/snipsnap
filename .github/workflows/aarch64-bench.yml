name: aarch64 benchmark

on:
  push:
    branches: [ccr-e4c01f21-x6mf9a]
    paths: ["src/**", "examples/**", ".github/aarch64-bench/**", ".github/workflows/aarch64-bench.yml"]
  workflow_dispatch:

jobs:
  bench:
    if: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, n: 1, ops: "decode encode", variants: "z1*", targets: "plain:"}
          - {os: ubuntu-24.04, n: 2, ops: "decode encode", variants: "z1*", targets: "plain:"}
          - {os: ubuntu-24.04, n: 3, ops: "decode encode", variants: "z1*", targets: "plain:"}
          - {os: ubuntu-24.04, n: 4, ops: "decode encode", variants: "z1*", targets: "plain:"}
          - {os: ubuntu-24.04, n: 5, ops: "decode encode", variants: "z1*", targets: "plain:"}
          - {os: ubuntu-24.04, n: 6, ops: "decode encode", variants: "z1*", targets: "plain:"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Build C++ snappy with clang
        run: |
          if command -v apt-get > /dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y -q clang cmake
          fi
          git clone -q https://github.com/google/snappy.git "$RUNNER_TEMP/snappy-src"
          git -C "$RUNNER_TEMP/snappy-src" checkout -q 9466064
          cmake -S "$RUNNER_TEMP/snappy-src" -B "$RUNNER_TEMP/snappy-build" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DBUILD_SHARED_LIBS=ON \
            -DSNAPPY_BUILD_TESTS=OFF -DSNAPPY_BUILD_BENCHMARKS=OFF -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/snappy" \
            -DCMAKE_INSTALL_NAME_DIR="$RUNNER_TEMP/snappy/lib"
          cmake --build "$RUNNER_TEMP/snappy-build" -j4 && cmake --install "$RUNNER_TEMP/snappy-build"
      - name: Download a ClickBench partition
        run: curl -sSfL -o "$RUNNER_TEMP/hits_0.parquet" https://datasets.clickhouse.com/hits_compatible/athena_partitioned/hits_0.parquet
      - name: Benchmark
        run: |
          (lscpu | grep -E "Model name|Vendor|Flags") 2>/dev/null || sysctl -n machdep.cpu.brand_string || true
          TARGETS="${{ matrix.targets }}" VARIANTS="${{ matrix.variants }}" OPS="${{ matrix.ops }}" ROUNDS=3 \
            bash .github/aarch64-bench/ab.sh "$RUNNER_TEMP/snappy" "$RUNNER_TEMP/hits_0.parquet" "$RUNNER_TEMP/ab" 2>&1
      - name: Output-offset sweep
        run: bash .github/aarch64-bench/sweep.sh "$RUNNER_TEMP/sweep" z1 z1c z1n 2>&1
      - name: Compressed bytes against C++
        run: |
          export DYLD_LIBRARY_PATH="$RUNNER_TEMP/snappy/lib" LD_LIBRARY_PATH="$RUNNER_TEMP/snappy/lib"
          for b in "$RUNNER_TEMP"/ab/compare-*; do
            out=$("$b" --identical | grep "differ" || true)
            echo "== identical $(basename "$b"): $(echo "$out" | grep -vc " 0 of" || true) of $(echo "$out" | grep -c . || true) cases differ from C++"
          done

  bolt:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - name: Build C++ snappy with clang, install BOLT and perf
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang cmake
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          for v in 21 20 19; do
            echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-$v main" | sudo tee /etc/apt/sources.list.d/llvm.list
            if sudo apt-get update -q > /dev/null && sudo apt-get install -y -q "bolt-$v"; then break; fi
          done
          sudo apt-get install -y -q linux-tools-common "linux-tools-$(uname -r)" || true
          echo -1 | sudo tee /proc/sys/kernel/perf_event_paranoid
          git clone -q https://github.com/google/snappy.git "$RUNNER_TEMP/snappy-src"
          git -C "$RUNNER_TEMP/snappy-src" checkout -q 9466064
          cmake -S "$RUNNER_TEMP/snappy-src" -B "$RUNNER_TEMP/snappy-build" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DBUILD_SHARED_LIBS=ON \
            -DSNAPPY_BUILD_TESTS=OFF -DSNAPPY_BUILD_BENCHMARKS=OFF -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/snappy"
          cmake --build "$RUNNER_TEMP/snappy-build" -j4 && cmake --install "$RUNNER_TEMP/snappy-build"
      - name: Download a ClickBench partition
        run: curl -sSfL -o "$RUNNER_TEMP/hits_0.parquet" https://datasets.clickhouse.com/hits_compatible/athena_partitioned/hits_0.parquet
      - name: BOLT and counters
        run: |
          lscpu | grep -E "Model name" || true
          mv .github/aarch64-bench/variants "$RUNNER_TEMP/variants-x86"
          SKIP_PGO=1 DUMP=8snipsnap6encode14compress_block \
            .github/aarch64-bench/pgo-bolt.sh "$RUNNER_TEMP/snappy" "$RUNNER_TEMP/hits_0.parquet" "$RUNNER_TEMP/pb" > "$RUNNER_TEMP/bolt.txt" 2>&1 || true
          grep -v "^ *[0-9a-f]*:" "$RUNNER_TEMP/bolt.txt" | grep -v "^$" | head -200
          export LD_LIBRARY_PATH="$RUNNER_TEMP/snappy/lib" SNAPPY_CPP_PREFIX="$RUNNER_TEMP/snappy"
          .github/aarch64-bench/perf-bolt.sh "$RUNNER_TEMP/pb" 2>&1 | tee "$RUNNER_TEMP/perf.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: bolt
          path: |
            ${{ runner.temp }}/bolt.txt
            ${{ runner.temp }}/perf.txt
