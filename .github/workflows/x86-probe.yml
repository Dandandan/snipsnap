name: x86 probe

on:
  push:
    branches: [ccr-e4c01f21-x6mf9a]
    paths: [".github/aarch64-bench/**", ".github/workflows/x86-probe.yml"]
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - name: Build C++ snappy with clang, install BOLT
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang cmake
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          for v in 21 20 19; do
            echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-$v main" | sudo tee /etc/apt/sources.list.d/llvm.list
            if sudo apt-get update -q > /dev/null && sudo apt-get install -y -q "bolt-$v"; then break; fi
          done
          git clone -q https://github.com/google/snappy.git "$RUNNER_TEMP/snappy-src"
          git -C "$RUNNER_TEMP/snappy-src" checkout -q 9466064
          cmake -S "$RUNNER_TEMP/snappy-src" -B "$RUNNER_TEMP/snappy-build" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DBUILD_SHARED_LIBS=ON \
            -DSNAPPY_BUILD_TESTS=OFF -DSNAPPY_BUILD_BENCHMARKS=OFF -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/snappy"
          cmake --build "$RUNNER_TEMP/snappy-build" -j4 && cmake --install "$RUNNER_TEMP/snappy-build"
      - name: Download a ClickBench partition
        run: curl -sSfL -o "$RUNNER_TEMP/hits_0.parquet" https://datasets.clickhouse.com/hits_compatible/athena_partitioned/hits_0.parquet
      - name: Plain, BOLT, and BOLT of compress_block alone
        run: |
          lscpu | grep -E "Model name" || true
          rm -rf .github/aarch64-bench/variants
          SKIP_PGO=1 DUMP=8snipsnap6encode14compress_block \
          BOLT_EXTRA="cb:-reorder-blocks=ext-tsp -split-functions -split-all-cold -funcs=@CB@;cb-nosplit:-reorder-blocks=ext-tsp -funcs=@CB@;cb-split:-reorder-blocks=none -split-functions -split-all-cold -funcs=@CB@" \
            .github/aarch64-bench/pgo-bolt.sh "$RUNNER_TEMP/snappy" "$RUNNER_TEMP/hits_0.parquet" "$RUNNER_TEMP/pb" > "$RUNNER_TEMP/pb.txt" 2>&1 || true
          grep -v "^ *[0-9a-f]*:" "$RUNNER_TEMP/pb.txt" | grep -v "^$"
      - uses: actions/upload-artifact@v4
        with:
          name: layout-${{ matrix.n }}
          path: ${{ runner.temp }}/pb.txt
