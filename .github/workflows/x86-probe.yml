name: x86 probe

on:
  push:
    branches: [ccr-e4c01f21-x6mf9a]
    paths: [".github/aarch64-bench/**", ".github/workflows/x86-probe.yml"]
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build C++ snappy with clang, install perf
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang cmake
          sudo apt-get install -y -q linux-tools-common "linux-tools-$(uname -r)" || sudo apt-get install -y -q linux-tools-generic || true
          echo -1 | sudo tee /proc/sys/kernel/perf_event_paranoid
          git clone -q https://github.com/google/snappy.git "$RUNNER_TEMP/snappy-src"
          git -C "$RUNNER_TEMP/snappy-src" checkout -q 9466064
          cmake -S "$RUNNER_TEMP/snappy-src" -B "$RUNNER_TEMP/snappy-build" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DBUILD_SHARED_LIBS=ON \
            -DSNAPPY_BUILD_TESTS=OFF -DSNAPPY_BUILD_BENCHMARKS=OFF -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/snappy"
          cmake --build "$RUNNER_TEMP/snappy-build" -j4 && cmake --install "$RUNNER_TEMP/snappy-build"
      - name: Download a ClickBench partition
        run: curl -sSfL -o "$RUNNER_TEMP/hits_0.parquet" https://datasets.clickhouse.com/hits_compatible/athena_partitioned/hits_0.parquet
      - name: Counters
        run: |
          lscpu | grep -E "Model name|Hypervisor" || true
          uname -r
          export LD_LIBRARY_PATH="$RUNNER_TEMP/snappy/lib" SNAPPY_CPP_PREFIX="$RUNNER_TEMP/snappy"
          cargo build -q --release --example compare
          bash .github/aarch64-bench/x86-perf.sh target/release/examples/compare 2>&1
      - name: Output-offset sweep against the build without the Zen 3/4 copy
        run: bash .github/aarch64-bench/sweep.sh "$RUNNER_TEMP/sweep" nofix 2>&1
      - name: Benchmark against it on Zen 4
        run: |
          if lscpu | grep -q "9V74"; then
            VARIANTS=nofix ROUNDS=3 bash .github/aarch64-bench/ab.sh "$RUNNER_TEMP/snappy" "$RUNNER_TEMP/hits_0.parquet" "$RUNNER_TEMP/ab" 2>&1
          else
            echo "not Zen 4"
          fi
